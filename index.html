<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Incense to Ask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500&family=Noto+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f4ede0; --surface:#fffaf0; --surface2:#ebe1cf; --ink:#1e1813; --muted:#5f5241; --line:#d6c7ad;
  --brass:#7a5a1e; --ember:#d4542b; --ember-ink:#1e1813; --card:#1e1813; --card-ink:#f1e8d8; --card-muted:#c8bba5;
  --urgent:#b3321f; --urgent-ink:#fff6ea;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#15110e; --surface:#1e1813; --surface2:#271f19; --ink:#f1e8d8; --muted:#b3a48b; --line:#3a2f26;
    --brass:#c9a24a; --ember:#e2683f; --ember-ink:#15110e; --card:#271f19; --card-ink:#f1e8d8; --card-muted:#c8bba5;
    --urgent:#c7432c; --urgent-ink:#fff6ea;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#15110e; --surface:#1e1813; --surface2:#271f19; --ink:#f1e8d8; --muted:#b3a48b; --line:#3a2f26;
  --brass:#c9a24a; --ember:#e2683f; --ember-ink:#15110e; --card:#271f19; --card-ink:#f1e8d8; --card-muted:#c8bba5;
  --urgent:#c7432c; --urgent-ink:#fff6ea;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
button{font:inherit;color:inherit}
a{color:var(--brass)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.brand{font-family:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;letter-spacing:.28em;color:var(--brass);font-weight:700}
.modes{display:flex;gap:4px;background:var(--surface2);border-radius:999px;padding:4px}
.modes a{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-size:14px}
.modes a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:500}
.banner{margin:12px 20px 0;padding:10px 14px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:14px}
.banner[hidden]{display:none}

.layout{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding:20px;max-width:1200px;margin:0 auto}
.pane{flex:1 1 360px;max-width:560px;min-width:0}
.pane[hidden]{display:none}
.pane-label{font-size:12px;letter-spacing:.24em;color:var(--muted);margin:0 0 10px}

/* ---------- burner ---------- */
.stage{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:600/560}
.bowl{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;z-index:2;pointer-events:none}
.sticks{position:absolute;inset:0;z-index:3;pointer-events:none}
.stick{position:absolute;bottom:calc(48.8% - 2px);width:2.2%;margin-left:-1.1%;border-radius:3px 3px 0 0;
  background:linear-gradient(to bottom,#8c5a36 0%,#9b6640 82%,#211d1a 100%);
  transform-origin:bottom center;transition:height 1.2s ease}
.stick.enter{animation:enter .9s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:translateY(-40%);opacity:0}to{transform:none;opacity:1}}
.ember{position:absolute;left:50%;top:-4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--ember);
  box-shadow:0 0 8px 3px rgba(226,104,63,.75),0 0 24px 8px rgba(226,104,63,.3)}
.ember.flicker{animation:flicker 1.4s infinite}
@keyframes flicker{0%,100%{opacity:1;transform:scale(1)}40%{opacity:.45;transform:scale(.8)}60%{opacity:.9;transform:scale(1.05)}}
.ember.steady{box-shadow:0 0 12px 5px rgba(255,150,80,.9),0 0 36px 14px rgba(255,150,80,.4);background:#ffb070}
.smoke{position:absolute;left:50%;bottom:100%;width:46px;height:70px;margin-left:-23px;opacity:.45;pointer-events:none}
.smoke path{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:6 10;animation:rise 3s linear infinite}
@keyframes rise{to{stroke-dashoffset:-64}}
.tag{position:absolute;left:100%;top:58%;margin-left:4px;background:#f6eedd;color:#1e1813;font-size:11px;line-height:1.25;padding:4px 7px;border-radius:2px;white-space:nowrap;transform:rotate(-5deg);box-shadow:0 1px 2px rgba(0,0,0,.25)}

.status{text-align:center;margin:8px auto 18px;max-width:440px;min-height:72px}
.status .big{font-size:30px;line-height:1.15}
.status .small{color:var(--muted);font-size:15px;margin-top:4px}

.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.tray.people{margin-top:12px}
.pick[aria-pressed="true"]{border:2px solid var(--brass);background:var(--surface2);padding:13px 11px 15px}
.pick[aria-pressed="true"]:disabled{opacity:1}
.pick.person .art img{width:96px;height:96px;max-height:none;border-radius:50%;object-fit:cover;object-position:center top;background:var(--surface2)}
.to{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.22em;color:#c9a24a}
.to img{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:center top;background:#3a2f26}
.wipe-hit{position:absolute;inset:0;z-index:4;background:transparent;border:0;border-radius:16px;cursor:pointer}
.wipe-hit[hidden]{display:none}
.wipe-hit:focus-visible{outline:2px solid var(--brass);outline-offset:4px}
.sticks.wiping .stick{animation:wipe .7s ease-in forwards}
@keyframes wipe{to{opacity:0;transform:translateY(-35%) rotate(-6deg);filter:blur(2px)}}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;min-height:170px;padding:14px 12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:center;cursor:pointer}
.pick:hover:not(:disabled){border-color:var(--brass)}
.pick:disabled{opacity:.4;cursor:default}
.pick .art{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:96px}
.pick .art img{max-width:100%;max-height:104px;object-fit:contain;display:block}
.pick .mini{display:flex;gap:7px;align-items:flex-end;height:80px}
.pick .mini i{display:block;width:4px;height:80px;border-radius:2px;background:linear-gradient(to bottom,var(--ember) 0 5px,#9b6640 5px)}
.pick .t{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:24px;line-height:1.1}
.pick.urgent{border-color:var(--urgent)}
.clear{display:block;margin:14px auto 0;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.clear[hidden]{display:none}

/* ---------- helper ---------- */
.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 18px 20px;display:flex;flex-direction:column;gap:16px;min-height:560px}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.avatar i{display:block;width:3px;height:22px;border-radius:2px;background:linear-gradient(to bottom,var(--ember) 0 5px,#b8913f 5px)}
.who .n{font-weight:500}
.who .m{font-size:13px;color:var(--muted)}
.sound{min-height:44px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.sound[hidden]{display:none}
.msg{background:var(--card);color:var(--card-ink);border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;gap:12px}
.msg.urgent{background:var(--urgent);color:var(--urgent-ink)}
.msg .k{font-size:12px;letter-spacing:.26em;color:var(--brass)}
:root .msg .k{color:#c9a24a}
.msg.urgent .k{color:var(--urgent-ink);opacity:.85}
.msg .h{font-size:32px;line-height:1.1}
.msg .b{font-size:17px;color:var(--card-muted)}
.msg.urgent .b{color:var(--urgent-ink)}
.msg .b strong{color:inherit;font-weight:500}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:#e2683f;border-radius:3px;transition:width .6s}
.msg.urgent .bar span{background:#fff6ea}
.msg .time{font-size:13px;color:var(--card-muted)}
.msg.urgent .time{color:var(--urgent-ink);opacity:.85}
#helperBody{display:flex;flex-direction:column;gap:14px}
.quiet{border:1px solid var(--line);border-radius:20px;padding:24px 22px;color:var(--muted)}
.quiet .h{font-size:28px;color:var(--ink);line-height:1.15;margin-bottom:6px}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{min-height:54px;border-radius:14px;border:1px solid var(--ink);background:transparent;cursor:pointer;font-size:17px}
.btn.primary{background:var(--ember);border-color:var(--ember);color:var(--ember-ink);font-weight:500}
.btn.ghost{border-color:transparent;color:var(--muted);font-size:15px;min-height:46px}
.done{border:1px solid var(--brass);border-radius:16px;padding:16px 18px;background:var(--surface2)}
.done .t{font-weight:500}
.done .s{font-size:15px;color:var(--muted)}
.log{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.log h3{margin:0 0 6px;font-size:12px;letter-spacing:.22em;color:var(--muted);font-weight:500}
.log ol{list-style:none;margin:0;padding:0;font-size:14px;color:var(--muted)}
.log li{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.log li span:last-child{flex:none;font-variant-numeric:tabular-nums}

.foot{text-align:center;color:var(--muted);font-size:13px;padding:8px 20px 28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.ember.flicker,.smoke path,.stick.enter{animation:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">INCENSE TO ASK</div>

    <a href="#helper" data-mode="helper">Helper</a>
    <a href="#both" data-mode="both">Both</a>

</header>
<div class="banner" id="banner" hidden></div>

<main class="layout">
  <section class="pane" id="burnerPane" aria-label="Grandma Chen’s burner">
    <div class="stage" id="stage">
      <div class="sticks" id="sticks"></div>
      <button type="button" class="wipe-hit" id="wipeBtn" aria-label="Wipe the burner clean" hidden></button>

  };
  var PEOPLE_ORDER = ['mei','lin','hua'];
  var selTask = null, selPerson = null;
  function personName(id){ return (PEOPLE[id] || PEOPLE.mei).name; }
  function nextPerson(id){ var i = PEOPLE_ORDER.indexOf(id); return PEOPLE_ORDER[(i + 1) % PEOPLE_ORDER.length]; }
  var BURN_MIN = 40;

  var state = {current:null, log:[]};
  var docRef = null;         // db document when live
  var live = false;
  var lastSeenLit = null;
  var audioCtx = null;

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- modes ---------- */
  function mode(){
    var h = (location.hash || '').replace('#','');
    if (h === 'burner' || h === 'helper' || h === 'both') return h;
    return 'both';
  }
  function applyMode(){
    var m = mode();
    $('burnerPane').hidden = (m === 'helper');
    $('helperPane').hidden = (m === 'burner');
    Array.prototype.forEach.call(document.querySelectorAll('.modes a'), function(a){
      if (a.getAttribute('data-mode') === m) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
  }
  window.addEventListener('hashchange', applyMode);

  /* ---------- helpers ---------- */
  function now(){ return Date.now(); }
  function clock(t){ var d=new Date(t); return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
  function minutesLeft(c){
    var left = BURN_MIN - (now() - c.litAt)/60000;
    return Math.max(0, Math.ceil(left));
  }
  function burnFrac(c){
    var f = (now() - c.litAt)/(BURN_MIN*60000);
    return Math.min(1, Math.max(0, f));
  }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

  /* ---------- writes ---------- */
  var relay = false;
  function commit(next){
    next.rev = now();
    state = next;
    render();
    if (relay) relayPublish(next);
    if (live && docRef){
      docRef.set(JSON.parse(JSON.stringify(next))).catch(function(e){
        if (e && e.code === 'invalid_argument'){
          showBanner('This screen can only watch. Ask the owner to make you a Contributor to light incense.');
        } else if (e && e.code === 'unavailable'){
          setTimeout(function(){ docRef.set(JSON.parse(JSON.stringify(state))).catch(function(){}); }, 600 + Math.random()*800);
        } else {
          showBanner('Couldn’t sync just now. Try again in a moment.');
        }
      });
    }
  }
  function withLog(log, text){
    var l = (log || []).slice(0, 7);
    l.unshift({text:text, at:now()});
    return l;
  }

  function light(kind, to){
    if (state.current) return;
    var s = STICKS[kind];
    commit({
      current:{id:String(now()), kind:kind, to:to, litAt:now(), reply:null, repliedAt:null},
      log: withLog(state.log, 'Lit: ' + s.label + ' → ' + personName(to))
    });
  }
  function tryLight(){
    if (selTask && selPerson && !state.current) light(selTask, selPerson);
  }
  function reply(r){
    if (!state.current || state.current.reply) return;
    var c = state.current, who = personName(c.to);
    if (r === 'pass'){
      var nx = nextPerson(c.to);
      commit({current:Object.assign({}, c, {to:nx, reply:null, repliedAt:null}), log: withLog(state.log, who + ' passed it to ' + personName(nx))});
      return;
    }
    var text = {coming: who + ' is on the way', later: who + ' will come later today'}[r];
    commit({current:Object.assign({}, c, {reply:r, repliedAt:now()}), log: withLog(state.log, text)});
  }
  function undoReply(){
    if (!state.current) return;
    commit({current:Object.assign({}, state.current, {reply:null, repliedAt:null}), log:state.log});
  }
  function clearBurner(){
    selTask = null; selPerson = null;
    commit({current:null, log:state.log});
  }

  /* ---------- burner render ---------- */
  var renderedStickId = null;
  function renderBurner(){
    var c = state.current;
    var wrap = $('sticks');
    if (!c){
      wrap.textContent = '';
      renderedStickId = null;
    } else if (renderedStickId !== c.id){
      wrap.textContent = '';
      var s = STICKS[c.kind] || {count:1};
      var xs = s.count === 3 ? [41, 50, 59] : [50];
      xs.forEach(function(x, i){
        var st = el('div','stick enter');
        st.style.left = x + '%';
        st.style.animationDelay = (i*0.12) + 's';
        var em = el('div','ember');
        st.appendChild(em);
        if (s.count === 1){
          var sm = document.createElementNS('http://www.w3.org/2000/svg','svg');
          sm.setAttribute('class','smoke'); sm.setAttribute('viewBox','0 0 60 90'); sm.setAttribute('aria-hidden','true');
          var p = document.createElementNS('http://www.w3.org/2000/svg','path');
          p.setAttribute('d','M30 88 C 18 70, 42 58, 30 40 S 20 14, 34 2');
          sm.appendChild(p); st.appendChild(sm);
        }
        if (s.need){ st.appendChild(el('div','tag')); }
        wrap.appendChild(st);
      });
      renderedStickId = c.id;
    }
    // stick height & ember state
    Array.prototype.forEach.call(wrap.querySelectorAll('.stick'), function(st){
      var f = c ? burnFrac(c) : 0;
      st.style.height = (34 - 24*f) + '%';
      var tg = st.querySelector('.tag');
      if (tg && c){ tg.textContent = (STICKS[c.kind] || {label:''}).label + ' — ' + personName(c.to); }
      var em = st.querySelector('.ember');
      if (em){ em.className = 'ember ' + (c && c.reply && c.reply !== 'pass' ? 'steady' : 'flicker'); }
    });

    var tray = $('tray'), ptray = $('peopleTray');
    if (!tray.childElementCount){
      ORDER.forEach(function(k){
        var s = STICKS[k];
        var b = el('button', 'pick');
        b.type = 'button';
        b.setAttribute('data-kind', k);
        var art = el('span','art'); art.setAttribute('aria-hidden','true');
        var im = document.createElement('img'); im.src = s.img; im.alt = ''; art.appendChild(im);
        b.appendChild(art);
        b.appendChild(el('span','t', s.label));
        b.addEventListener('click', function(){ if (state.current) return; selTask = k; renderBurner(); tryLight(); });
        tray.appendChild(b);
      });
      PEOPLE_ORDER.forEach(function(id){
        var p = PEOPLE[id];
        var b = el('button', 'pick person');
        b.type = 'button';
        b.setAttribute('data-person', id);
        var art = el('span','art'); art.setAttribute('aria-hidden','true');
        var im = document.createElement('img'); im.src = p.img; im.alt = ''; art.appendChild(im);
        b.appendChild(art);
        b.appendChild(el('span','t', p.name));
        b.addEventListener('click', function(){ if (state.current) return; selPerson = id; renderBurner(); tryLight(); });
        ptray.appendChild(b);
      });
    }
    var curTask = c ? c.kind : selTask, curPerson = c ? c.to : selPerson;
    Array.prototype.forEach.call(tray.querySelectorAll('.pick'), function(b){
      var on = b.getAttribute('data-kind') === curTask;
      b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.disabled = !!c && !on;
    });
    Array.prototype.forEach.call(ptray.querySelectorAll('.pick'), function(b){
      var on = b.getAttribute('data-person') === curPerson;
      b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.disabled = !!c && !on;
    });
    $('wipeBtn').hidden = !c;
  }

  /* ---------- helper render ---------- */
  function renderHelper(){
    var c = state.current;
    var body = $('helperBody');
    body.textContent = '';
    $('whoMeta').textContent = c ? 'Incense to Ask · ' + clock(c.litAt) : 'Incense to Ask';
    $('helperLabel').textContent = c ? (personName(c.to) + '’s phone').toUpperCase() : 'HELPER’S PHONE';

    if (!c){
      var q = el('div','quiet');
      q.appendChild(el('div','h serif','Her burner is quiet.'));
      q.appendChild(el('div', null, 'When Grandma Chen lights a stick, it will appear here.'));
      body.appendChild(q);
    } else {
      var s = STICKS[c.kind] || {need:'something'};
      var m = el('div', 'msg' + (c.kind === 'three' ? ' urgent' : ''));
      if (c.kind === 'peace'){
        m.appendChild(el('div','k','MORNING INCENSE'));
        m.appendChild(el('div','h serif','Grandma Chen lit her morning incense.'));
        m.appendChild(el('div','b','All is well.'));
      } else if (c.kind === 'three'){
        m.appendChild(el('div','k','THREE STICKS'));
        m.appendChild(el('div','h serif','Grandma Chen lit three sticks.'));
        m.appendChild(el('div','b','She may need someone with her. She doesn’t have to explain.'));
      } else {
        var to = el('div','to');
        var ti = document.createElement('img'); ti.src = (PEOPLE[c.to] || PEOPLE.mei).img; ti.alt = ''; to.appendChild(ti);
        to.appendChild(el('span', null, 'AN INCENSE FOR ' + personName(c.to).toUpperCase()));
        m.appendChild(to);
        m.appendChild(el('div','h serif','Grandma Chen lit an incense for you, ' + personName(c.to) + '.'));
        var b = el('div','b'); b.appendChild(document.createTextNode('She’d like help with '));
        b.appendChild(el('strong', null, s.need)); b.appendChild(document.createTextNode('.'));
        m.appendChild(b);
      }
      if (c.kind !== 'peace'){
        var bar = el('div','bar'); var span = el('span');
        span.style.width = (c.reply && c.reply !== 'pass') ? '100%' : Math.max(4, 100 - burnFrac(c)*100) + '%';
        bar.appendChild(span); m.appendChild(bar);
        m.appendChild(el('div','time', (c.reply && c.reply !== 'pass') ? 'Answered — her incense glows steady' : 'Burning · about ' + minutesLeft(c) + ' minutes left'));
      }
      body.appendChild(m);

      if (!c.reply){
        var a = el('div','actions');
        if (c.kind === 'peace'){
          a.appendChild(btn('Send her a wave','btn', function(){ reply('wave'); }));
        } else {
          a.appendChild(btn('I’m on my way','btn primary', function(){ reply('coming'); }));
          if (c.kind !== 'three') a.appendChild(btn('Later today','btn', function(){ reply('later'); }));
          a.appendChild(btn('Ask ' + personName(nextPerson(c.to)) + ' instead','btn ghost', function(){ reply('pass'); }));
        }
        body.appendChild(a);
      } else {
        var copy = {
          coming:['Her incense now glows steady.','Grandma Chen can see that someone is coming.'],
          later:['She knows you’ll come later today.','Her incense glows steady until you arrive.'],
          pass:['Passed on, quietly.','Aunt Lin has been asked. Grandma Chen won’t have to ask again.'],
          wave:['Wave sent.','She’ll see it beside her burner.']
        }[c.reply];
        var d = el('div','done');
        d.appendChild(el('div','t', copy[0]));
        d.appendChild(el('div','s', copy[1]));
        body.appendChild(d);
        body.appendChild(btn('Undo','btn ghost', undoReply));
      }
    }

    var ol = $('logList'); ol.textContent = '';
    (state.log || []).forEach(function(item){
      var li = el('li'); li.appendChild(el('span', null, item.text)); li.appendChild(el('span', null, clock(item.at))); ol.appendChild(li);
    });
    if (!(state.log || []).length){ var li = el('li'); li.appendChild(el('span', null, 'Nothing yet')); ol.appendChild(li); }
  }
  function btn(label, cls, fn){ var b = el('button', cls, label); b.type='button'; b.addEventListener('click', fn); return b; }

  /* ---------- notify (helper side) ---------- */
  function notify(c){
    if (mode() === 'burner') return;
    if (navigator.vibrate){ try{ navigator.vibrate(c.kind === 'three' ? [200,100,200,100,400] : [180,90,180]); }catch(e){} }
    if (!audioCtx) return;
    try{
      var tones = c.kind === 'three' ? [659, 659, 659] : [784, 1046];
      tones.forEach(function(f, i){
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        var t = audioCtx.currentTime + i*0.28;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+1.2);
        o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+1.3);
      });
    }catch(e){}
  }
  $('soundBtn').addEventListener('click', function(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC){ audioCtx = new AC(); audioCtx.resume(); }
    }catch(e){}
    $('soundBtn').hidden = true;
  });

  /* ---------- render ---------- */
  function render(){
    if (state.current && state.current.id !== lastSeenLit){
      if (lastSeenLit !== null || state.current.litAt > now() - 10000) notify(state.current);
      lastSeenLit = state.current.id;
    } else if (!state.current){ lastSeenLit = lastSeenLit === null ? null : ''; }
    renderBurner();
    renderHelper();
  }
  function showBanner(t){ var b=$('banner'); b.textContent=t; b.hidden=false; }

  var wiping = false;
  $('wipeBtn').addEventListener('click', function(){
    if (!state.current || wiping) return;
    wiping = true;
    $('sticks').classList.add('wiping');
    setTimeout(function(){ $('sticks').classList.remove('wiping'); wiping = false; clearBurner(); }, 700);
  });
  setInterval(function(){ if (state.current) { renderBurner(); renderHelper(); } }, 15000);

  applyMode();
  render();

  /* ---------- live sync ---------- */
  var localNote = 'Live sync isn’t available on this screen, so both sides run here together.';
  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('db').then(function(db){
      if (!db){ showBanner(localNote); return; }
      try { docRef = db.doc('shrine/state'); } catch(e){ showBanner(localNote); return; }
      live = true;
      docRef.onSnapshot(function(snap){
        if (snap.exists){
          var d = snap.data() || {};
          state = {current: d.current || null, log: Array.isArray(d.log) ? d.log : [], rev: d.rev || 0};
        } else {
          state = {current:null, log:[]};
        }
        render();
      }, function(){
        live = false;
        showBanner('Live sync stopped. Reload the page to reconnect.');
      });
    }, function(){ showBanner(localNote); });
  } else {
    startRelay();
  }

  /* ---------- relay sync (when hosted outside claude.ai, e.g. Netlify) ---------- */
  function relayBase(){
    var room = '';
    try { room = new URLSearchParams(location.search).get('room') || ''; } catch(e){}
    room = room.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || 'demo-k7q3v9';
    return 'https://ntfy.sh/incense-to-ask-' + room;
  }
  function relayApply(d){
    if (!d || typeof d !== 'object') return;
    if ((d.rev || 0) < (state.rev || 0)) return;
    state = {current: d.current || null, log: Array.isArray(d.log) ? d.log : [], rev: d.rev || 0};
    render();
  }
  function relayPublish(s){
    fetch(relayBase(), {method:'POST', body: JSON.stringify(s)}).catch(function(){
      showBanner('Couldn’t reach the other phone. Check the internet connection.');
    });
  }
  function startRelay(){
    if (!window.fetch || !window.EventSource){ showBanner(localNote); return; }
    relay = true;
    var base = relayBase();
    fetch(base + '/json?poll=1&since=12h').then(function(r){ return r.text(); }).then(function(txt){
      var lines = txt.trim().split('\n'), last = null;
      lines.forEach(function(l){ try { var m = JSON.parse(l); if (m.event === 'message') last = m; } catch(e){} });
      if (last){ try { relayApply(JSON.parse(last.message)); } catch(e){} }
    }).catch(function(){}).then(function(){
      var es = new EventSource(base + '/sse');
      es.onmessage = function(e){
        try { var m = JSON.parse(e.data); if (m.event === 'message') relayApply(JSON.parse(m.message)); } catch(err){}
      };
      es.onerror = function(){ showBanner('Reconnecting to the other phone…'); };
      es.onopen = function(){ var b = $('banner'); if (b.textContent.indexOf('Reconnecting') === 0) b.hidden = true; };
    });
  }
})();
</script>
</body>
</html>
